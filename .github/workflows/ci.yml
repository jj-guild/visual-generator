name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tesseract (OCR check dependency)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the package with dev extras
        run: uv venv && uv pip install -e ".[dev]"

      - name: Run the test suite (render + OCR check per template)
        run: .venv/bin/python -m pytest -q

      - name: OCR check of the shipped examples via the CLI
        run: |
          for f in data/*.json; do
            .venv/bin/vg-render --data "$f"
            .venv/bin/vg-ocr-check --data "$f"
          done
