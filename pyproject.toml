[project]
name = "visual-generator"
version = "0.1.0"
description = "Data-driven visual generator: JSON + template + art + text sections, OCR-verifiable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jj-guild" }]
keywords = ["visual", "generator", "template", "card", "ocr", "game"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = ["pillow>=10.0.0"]

[project.optional-dependencies]
fonts = ["matplotlib>=3.7.0"]
dev = ["pytest>=8.0", "matplotlib>=3.7.0"]

[project.urls]
Homepage = "https://github.com/jj-guild/visual-generator"
Issues = "https://github.com/jj-guild/visual-generator/issues"

[project.scripts]
vg-render = "visual_generator.engine:main"
vg-ocr-check = "visual_generator.ocr:main"
vg-demo-assets = "visual_generator.demo_assets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visual_generator"]

[tool.hatch.build]
exclude = ["examples", "data", "tests", ".venv", ".agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
